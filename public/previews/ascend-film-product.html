<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ascend · Film interface concepts</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#173a34;font:16px/1.5 system-ui,sans-serif}header{height:80px;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8e2de;background:white}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.12em}.label{font-size:13px;color:#665b7d;background:#f0eafa;border-radius:20px;padding:7px 16px}main{max-width:1200px;margin:auto;padding:48px 40px}h1{font-size:38px;line-height:1.15;letter-spacing:-.035em;font-weight:600;margin:8px 0 30px}h2{font-size:22px;margin:0 0 18px}p{margin:0 0 18px;color:#526a62}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}.panel{background:white;border:1px solid #dbe4df;border-radius:18px;padding:30px}.guidance{border-color:#c5b6e6;background:#faf8ff}.guidance h2{color:#6946ac}.quote{font-size:22px;line-height:1.65;color:#213b34;border-left:3px solid #86b6a5;padding-left:24px}.tabs{display:flex;gap:8px;margin:28px 0 24px}button{font:inherit;color:inherit;background:white;border:1px solid #d1ddd7;border-radius:24px;padding:12px 22px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#193e34;color:white}button:focus-visible{outline:3px solid #7651c6;outline-offset:3px}.row{padding:17px 0;border-bottom:1px solid #e1e8e4;display:flex;justify-content:space-between;gap:24px}.row:last-child{border:0}.row span{color:#6d677a}.quiet{font-size:13px;margin-top:24px}textarea{font:18px/1.65 system-ui;width:100%;height:160px;border:1px solid #cbdad3;border-radius:10px;padding:16px;resize:none;color:#243d34}.primary{background:#7150ba;color:white;border:0;margin-top:18px}.pill{display:inline-block;background:#e9f2ed;padding:5px 12px;border-radius:14px;color:#285c49;font-size:13px}.symbol{width:32px;height:34px}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:30px 20px}h1{font-size:30px}.label{font-size:11px}.panel{padding:22px}}
</style></head><body><header><div class="brand"><svg class="symbol" viewBox="0 0 48 48" fill="none" aria-hidden="true"><defs><linearGradient id="a" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse"><stop stop-color="#7b5cf0"/><stop offset=".55" stop-color="#5b6ef5"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><path d="M6 41L24 8L42 41M16 41L24 26L32 41" stroke="url(#a)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>ASCEND</div><span class="label" id="label">Illustrative feedback · Sample response</span></header><main id="main"></main><script>
const scene=new URLSearchParams(location.search).get('scene')||'feedback';const main=document.getElementById('main');
const response='I understand you needed the order for tomorrow. I’ll check with the delivery team and get back to you.';
if(scene==='feedback'){
main.innerHTML=`<p class="eyebrow">Customer Success Associate · Practice example</p><h1>Make your next response more useful.</h1><div class="grid"><section class="panel"><h2>A delayed order. An anxious customer.</h2><p>The customer needs her order for an event tomorrow. The tracking status has not changed for two days.</p><div class="quote">${response}</div><p class="quiet">Sample response shown for this film. No assessment score is calculated.</p></section><section class="panel guidance"><p class="eyebrow">Ascend · Constructive feedback example</p><h2>You recognised the customer’s concern.</h2><p>Make the next step specific: who will check the status, and when will the customer hear from you?</p><p>Commit to an update you can keep. Do not promise an unverified delivery time.</p><button class="primary" id="improve">Improve my response →</button></section></div>`;
document.getElementById('improve').onclick=()=>{document.querySelector('.quote').outerHTML=`<textarea aria-label="Improve the sample response">${response}</textarea>`;document.querySelector('textarea').focus();};
}else if(scene==='employer'){
document.getElementById('label').textContent='Planned employer experience · Sample evidence';
main.innerHTML=`<p class="eyebrow">Customer Success Associate</p><h1>Readiness, with the work behind it.</h1><div class="grid"><section class="panel"><h2>Productivity Index</h2><p>A view of readiness for a specific role.</p><span class="pill">Evidence before judgement</span><div class="row"><b>Work artifacts</b><span>Open the response</span></div><div class="row"><b>Skill evidence</b><span>Inspect the criteria</span></div><div class="row"><b>Interview readiness</b><span>Separate evidence needed</span></div><p class="quiet">No numeric score calculated in this concept.</p></section><section class="panel"><h2>Customer escalation</h2><div class="tabs"><button id="work" aria-pressed="true">The work</button><button id="gap" aria-pressed="false">What to develop</button></div><div id="evidence"><p class="quote">${response}</p><p>Criterion: acknowledge the impact and give a reliable next step.</p></div></section></div>`;
const select=gap=>{document.getElementById('work').setAttribute('aria-pressed',String(!gap));document.getElementById('gap').setAttribute('aria-pressed',String(gap));document.getElementById('evidence').innerHTML=gap?'<p class="eyebrow">Remaining gap</p><h2>Name the owner and next update.</h2><p>The response recognises the impact. The follow-up commitment still needs a person and a realistic update time.</p><p class="quiet">Technical resolution was not assessed in this example.</p>':`<p class="quote">${response}</p><p>Criterion: acknowledge the impact and give a reliable next step.</p>`;};document.getElementById('work').onclick=()=>select(false);document.getElementById('gap').onclick=()=>select(true);
}else{
document.getElementById('label').textContent='Planned college experience · Concept';
main.innerHTML='<p class="eyebrow">College placement team</p><h1>See where support is needed.</h1><div class="grid"><section class="panel"><h2>Cohort readiness</h2><p>Look at preparation across roles, then inspect the work behind it.</p><div class="row"><b>Role direction</b><span>Discovery</span></div><div class="row"><b>Workplace practice</b><span>Tasks & feedback</span></div><div class="row"><b>Interview preparation</b><span>Practice evidence</span></div></section><section class="panel guidance"><h2>The app guides each student.</h2><p>Ascend identifies gaps and gives constructive feedback directly.</p><p>The college sees where to focus its placement support.</p><p class="quiet">No student records or cohort metrics are represented in this concept.</p></section></div>';
}
</script></body></html>
