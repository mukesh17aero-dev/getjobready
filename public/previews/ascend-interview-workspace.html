 {id:"learn",q:"Tell me about something you had to learn quickly with nobody to teach you.",round:"hr",competency:"Learning quickly",state:"weak",why:"Show how you learn when there is no clear starting point.",note:"Choose one incident and explain what you personally did to work it out.",sample:"During a college event, I had to learn a registration tool on the morning it opened. I tested it with two sample entries, checked the instructions, then wrote a short checklist for the next volunteer. We could use the same process throughout the event."},
 {id:"pressure",q:"Describe a time you had more to do than time to do it in.",round:"hr",competency:"Working under pressure",state:"weak",why:"Explain the trade-off behind your priorities.",note:"Say what you decided could wait, and why that was the right trade-off.",sample:"During an event, the check-in queue grew while certificates still needed printing. I handled check-in first, asked a teammate to print the certificates, and told participants when to collect them. That kept both tasks moving without leaving the queue unattended."},

const state={view:"home",signedIn:true,role:"Customer Success Associate",round:"hr",interviewer:"asha",mode:"voice",mic:"unchecked",focus:"Explain my own contribution clearly",jd:"",question:0,answers:{},recording:false,search:"",filter:"all",roundFilter:"all",competency:"all",page:0,activeQuestion:"learn",drafts:{},feedback:false,historyIndex:0};
const views=["home","practice","room","feedback","questions","history"];
const person=()=>state.interviewer==="asha"?"Asha":"Ravi";
const statusName=s=>({weak:"Needs practice",solid:"Holding up",unattempted:"Not tried yet"}[s]);
const chip=s=>`<span class="chip ${s==="solid"?"earned":s==="weak"?"amber":"neutral"}">${statusName(s)}</span>`;
function notify(message){$("status").textContent=message;}
function modal(title,body,actions="",wide=false){$("modal").classList.toggle("questionSheet",wide);$("modalContent").innerHTML=`<h2 id="modalTitle">${esc(title)}</h2>${body}<div class="modalActions">${actions||btn("Got it","close")}</div>`;if(!$("modal").open)$("modal").showModal();}
function go(view){if(!views.includes(view))return;state.view=view;history.replaceState(null,"",`#${view}`);render();$("title").focus({preventScroll:true});$("title").scrollIntoView({block:"start",behavior:"instant"});}
function context(){return `<div class="inlineContext"><div><span>ROLE FOR THIS PREVIEW</span><strong>${esc(state.role||"Choose a role")}</strong></div>${btn("Change role","change-role","textButton")}</div>`;}
function home(){return `${context()}${state.signedIn?`<div class="resumeLine"><span aria-hidden="true">↗</span><div><strong>Your next focus: make your own contribution clear.</strong><p>Example last-interview feedback · explain what you did before describing what the team achieved.</p></div>${btn("See feedback","feedback")}</div>`:""}<div class="heroGrid"><section class="hero"><div class="heroTop"><span class="chip">AI MOCK INTERVIEW</span>${glyph}</div><h2>Find the words before<br>the real interview.</h2><p>Rehearse the conversation, handle follow-up questions and leave knowing what to improve.</p>${btn("Set up my interview →","practice","primary")}<div class="heroMeta"><span>◷ 10-minute session</span><span>Voice or typing</span><span>Feedback on your answers</span></div></section><div class="stack"><section class="card entryCard"><span class="entryIcon" aria-hidden="true">≡</span><p class="eyebrow">A FEW MINUTES TO PREPARE</p><h2>Work on one answer.</h2><p>Pick a question, try your response and focus on one useful improvement.</p>${btn("Open question practice →","questions","textButton")}</section><section class="card entryCard"><span class="entryIcon" aria-hidden="true">↗</span><p class="eyebrow">MAKE YOUR LAST ATTEMPT COUNT</p><h2>${state.signedIn?"Come back with a purpose.":"See what comes afterwards."}</h2><p>${state.signedIn?"Your previous interviews and feedback stay together, ready for the next rehearsal.":"Explore an example report before starting your first interview."}</p>${btn(state.signedIn?"View past interviews →":"View example feedback →",state.signedIn?"history":"feedback","textButton")}</section></div></div><div class="sectionTitle"><h2>${state.signedIn?"Pick up your preparation":"Try a question"}</h2><span>Illustrative examples</span></div><div class="workRows"><button class="workRow" data-action="question" data-value="learn"><span class="num">01</span><div>${chip(state.signedIn?"weak":"unattempted")}<h3>Learning something without a guide</h3><p>${state.signedIn?"Why pick this up: your last example needs a specific action you took.":"Find a real example and explain how you worked it out."}</p></div><b>→</b></button><button class="workRow" data-action="question" data-value="pressure"><span class="num">02</span><div>${chip(state.signedIn?"weak":"unattempted")}<h3>Handling more work than time</h3><p>${state.signedIn?"Why pick this up: explain why you prioritised one task over another.":"Talk through a decision about what could wait."}</p></div><b>→</b></button></div>`;}
function choice(label,sub,action,value,selected,icon=""){return `<button class="choice" data-action="${action}" data-value="${value}" aria-pressed="${selected}">${icon?`<span>${icon}</span>`:""}<div><strong>${label}</strong><small>${sub}</small></div><b>${selected?"✓":"○"}</b></button>`;}
function practice(){return `<div class="setupGrid"><section class="card"><div class="formSection"><label class="field"><span>The role you want to practise for</span><input id="role" value="${esc(state.role)}" maxlength="120" placeholder="e.g. Customer Success Associate"></label><p class="hint">Start with your chosen direction or enter another role.</p></div><div class="formSection"><div class="formLabel">Which conversation are you preparing for?</div><div class="choose">${choice("HR round","Your experience and motivation","round","hr",state.round==="hr")}${choice("Managerial round","Your decisions at work","round","managerial",state.round==="managerial")}</div></div><div class="formSection"><div class="formLabel">Choose your AI interviewer</div><div class="choose">${choice("Asha","AI interviewer","interviewer","asha",state.interviewer==="asha","A")}${choice("Ravi","AI interviewer","interviewer","ravi",state.interviewer==="ravi","R")}</div></div><div class="formSection"><div class="formLabel">How would you like to answer?</div><div class="choose">${choice("Speak","Review the transcript before sending","mode","voice",state.mode==="voice","◉")}${choice("Type","A quiet way to rehearse","mode","type",state.mode==="type","≡")}</div>${state.mode==="voice"?`<div class="device"><span class="dot"></span><div><strong>${state.mic==="ready"?"Microphone ready · simulated":state.mic==="blocked"?"Microphone unavailable · simulated":"Check your microphone before joining"}</strong><small>${state.mic==="blocked"?"Typing is available to continue.":"This preview never requests microphone access."}</small>${btn(state.mic==="ready"?"Check again":"Preview check","mic","textButton")}</div>${state.mic==="blocked"?btn("Switch to typing","mode","textButton","type"):""}`:""}</div><details class="optional"><summary>Add a job description or a focus <span>+</span></summary><label class="field"><span>Job description · optional</span><textarea id="jd" placeholder="Paste the role’s responsibilities…">${esc(state.jd)}</textarea></label><label class="field"><span>What would you like to be pushed on?</span><input id="focus" value="${esc(state.focus)}" placeholder="e.g. handling a difficult customer"></label></details></section><aside class="card setupAside"><p class="eyebrow">YOUR INTERVIEW, AT A GLANCE</p><div class="avatarOrb" aria-hidden="true">${person()[0]}</div><div class="person"><strong>${person()}</strong><span>Your AI interviewer · ${state.round==="hr"?"HR":"managerial"} round</span></div><div class="focusBox"><span class="chip">YOUR CHOSEN FOCUS</span><h3>${esc(state.focus||"Make your actions easy to follow.")}</h3><p>Explain the situation briefly, spend time on what you did, and end with the result.</p></div><div class="checkline"><b>◷</b> 10 minutes · example session</div><div class="checkline"><b>✓</b> One question at a time</div><div class="checkline"><b>↗</b> Useful feedback after the interview</div><p class="lockedNote">The preview uses fixed example questions; it does not generate them from your role or JD.</p><div style="margin-top:22px">${btn("Enter interview preview →","start","primary")}</div></aside></div>`;}
function room(){const text=interviewQuestions[state.round][state.question];return `<div class="roomHead"><div><strong>${esc(state.role)} · ${state.round==="hr"?"HR":"Managerial"} round</strong><small>Example conversation · no live audio or AI</small></div><div class="clock">◷ 10:00 <small>demo clock</small></div>${btn("End preview","end","textButton")}</div><div class="roomGrid"><aside class="card roomPerson"><p class="eyebrow">YOUR AI INTERVIEWER</p><div class="avatarOrb" aria-hidden="true">${person()[0]}</div><h3>${person()}</h3><p>Take a moment.<br>Then make it your own.</p><span class="modeTag">${state.mode==="voice"?"Voice preview":"Typing mode"}</span><div class="roomStages">${["Your introduction","A work example","Your questions"].map((label,i)=>`<span data-active="${i===state.question}"><i></i>${label}</span>`).join("")}</div></aside><section class="card roomQuestion"><div class="mobileStatus"><span class="initial">${person()[0]}</span>${person()} · AI interviewer</div><div class="cardHead"><span class="chip">QUESTION ${state.question+1} OF 3 · EXAMPLE</span>${btn("Previous answers","transcript","textButton")}</div><h2>${esc(text)}</h2><div class="replyMode"><span>Your answer</span><div class="toggle" aria-label="Answer mode"><button data-action="mode" data-value="voice" aria-pressed="${state.mode==="voice"}">Speak</button><button data-action="mode" data-value="type" aria-pressed="${state.mode==="type"}">Type</button></div></div>${state.mode==="voice"?`<div class="voiceBox"><button class="mic" data-action="record" aria-label="${state.recording?"Stop simulated recording":"Preview recording state"}">${state.recording?"■":"◉"}</button><div><strong>${state.recording?"Recording state preview":"Try the voice interaction"}</strong><small>No microphone is active. The waveform and transcript are examples.</small>${btn("Use sample transcript","sample-answer","textButton")}</div>${state.recording?glyph:""}</div>`:""}<label class="field"><span>${state.mode==="voice"?"Review your transcript":"Write your response"}</span><textarea id="roomAnswer" placeholder="Your words go here…">${esc(state.answers[state.question]||"")}</textarea><small>Your text stays local; it is not evaluated by this preview.</small></label><div class="roomButtons"><small>Fixed preview sequence · no score during the conversation</small>${btn(state.question===2?"View example feedback →":"Next example question →","next-question","primary")}</div></section></div>`;}
function feedback(){return `<section class="reviewBanner"><div><span class="chip">EXAMPLE INTERVIEW FEEDBACK</span><h2>Your experience is there.<br>Make your part in it clearer.</h2><p>Customer Success Associate · HR round · fixed example responses</p></div><div class="summarySignals"><span><b>3</b>Questions reviewed</span><span><b>1</b>Priority to work on</span></div></section><div class="insightColumns"><section class="card good"><p class="eyebrow">KEEP DOING THIS</p><h2>You connected your interest to the work.</h2><p>Your introduction explained why helping someone resolve a problem appeals to you.</p><p class="quoteLine">“I like staying with a problem until the person knows what happens next.”</p></section><section class="card"><p class="eyebrow">MAKE THIS STRONGER</p><h2>Show the decision you personally made.</h2><p>“We sorted it out” described the team’s result but left your contribution unclear.</p><div class="answerSteps"><span>Situation</span><span>Your action</span><span>Result</span></div></section></div><div class="sectionTitle"><h2>How the conversation landed</h2><span>Tap to see the evidence</span></div><div class="timeline"><button data-action="interview-evidence" data-value="0"><span>01 · INTRODUCTION</span><i></i><b>Relevant motivation</b></button><button data-action="interview-evidence" data-value="1" data-focus="true"><span>02 · WORK EXAMPLE</span><i></i><b>Action needs detail</b></button><button data-action="interview-evidence" data-value="2"><span>03 · YOUR QUESTIONS</span><i></i><b>Useful curiosity</b></button></div><div class="actionFeature"><span>↗</span><div><p class="eyebrow">ONE USEFUL NEXT STEP</p><h3>Try the learning example again.</h3><p>Describe one action you took and the result it led to.</p></div>${btn("Practise this answer →","question","primary","learn")}</div><details class="details"><summary>Full example transcript & feedback <span>+</span></summary><p><strong>Introduction:</strong> “I like staying with a problem until the person knows what happens next.” This connects motivation to the role.<br><br><strong>Learning example:</strong> “We had to learn the registration tool quickly and we sorted it out.” Specify your own decision and what changed because of it.<br><br><strong>Your question:</strong> “What does a useful first month in this role look like?” This asks about the actual work.</p></details><p class="fine">No interview score is invented here. The current interview API supplies qualitative feedback. This example report is separate from any answer entered in the preview.</p>`;}
function filtered(){const order={weak:0,unattempted:1,solid:2};return questions.filter(q=>(state.filter==="all"||(state.signedIn?q.state:"unattempted")===state.filter)&&(state.roundFilter==="all"||q.round===state.roundFilter)&&(state.competency==="all"||q.competency===state.competency)&&(!state.search.trim()||`${q.q} ${q.competency}`.toLowerCase().includes(state.search.trim().toLowerCase()))).sort((a,b)=>state.signedIn?order[a.state]-order[b.state]:0);}
function questionCards(){const all=filtered(),perPage=6,total=Math.max(1,Math.ceil(all.length/perPage));state.page=Math.min(state.page,total-1);return `<div class="questionGrid">${all.slice(state.page*perPage,state.page*perPage+perPage).map(q=>`<button class="qCard" data-action="question" data-value="${q.id}"><div class="top"><span class="round">${q.round==="hr"?"HR":"MANAGERIAL"} ROUND</span>${chip(state.signedIn?q.state:"unattempted")}</div><h2>${q.q}</h2><p>${state.signedIn&&q.state==="weak"?q.note:q.why}</p><div class="bottom"><span>${q.competency}</span><b>↗</b></div></button>`).join("")}</div>${all.length===0?`<section class="card libraryEmpty"><h2>No questions match these filters.</h2><p>Try a broader search or reset the filters.</p>${btn("Reset filters","reset-filters")}</section>`:""}<div class="pagination"><span role="status">${all.length} questions · page ${state.page+1} of ${total}</span><div><button data-action="page" data-value="-1" ${state.page===0?"disabled":""}>← Previous</button><button data-action="page" data-value="1" ${state.page>=total-1?"disabled":""}>Next →</button></div></div>`;}
function library(){return `<div class="questionToolbar"><label><span class="srOnly">Search questions</span><input id="search" type="search" value="${esc(state.search)}" placeholder="Search a question or competency…"></label><label><span class="srOnly">Interview round</span><select id="roundFilter"><option value="all">All rounds</option><option value="hr" ${state.roundFilter==="hr"?"selected":""}>HR round</option><option value="managerial" ${state.roundFilter==="managerial"?"selected":""}>Managerial round</option></select></label><label><span class="srOnly">Competency</span><select id="competency"><option value="all">All competencies</option>${[...new Set(questions.map(q=>q.competency))].map(c=>`<option ${state.competency===c?"selected":""}>${c}</option>`).join("")}</select></label></div><div class="filters" aria-label="Question status">${[["all","All questions"],["weak","Needs practice"],["unattempted","Not tried yet"],["solid","Holding up"]].map(([id,label])=>`<button data-action="filter" data-value="${id}" aria-pressed="${state.filter===id}">${label}</button>`).join("")}</div><div id="questionResults">${questionCards()}</div><p class="fine">Eight example questions shown in pages of six. On desktop, two cards sit side by side. Competencies come from the question bank; they are not new readiness skills.</p>`;}
function questionSheet(id,showFeedback=false){const q=questions.find(q=>q.id===id);if(!q)return;state.activeQuestion=id;state.feedback=showFeedback;modal(q.q,`<span class="chip">${q.round==="hr"?"HR":"MANAGERIAL"} ROUND · ${q.competency}</span><p>${q.why}</p>${showFeedback?`<div class="sampleResponse"><small>EXAMPLE ANSWER · NOT AN ANALYSIS OF YOUR DRAFT</small><p>${q.sample}</p></div><div class="questionFeedback"><p class="eyebrow">ONE THING TO TAKE INTO YOUR NEXT ATTEMPT</p><h3>${q.id==="learn"?"Make your own action visible.":"Give the interviewer something specific."}</h3><p>${q.note}</p></div><p class="fine">Your own draft is preserved. No personal feedback was generated and your question status has not changed.</p>`:`<label class="field" style="margin-top:19px"><span>Your answer</span><textarea id="questionAnswer" placeholder="Use a real experience. Say what you did and what happened…">${esc(state.drafts[id]||"")}</textarea><small>Draft stays in this tab. Nothing is sent or scored.</small></label><details class="storyPeek"><summary>A starting structure <span>+</span></summary><p>Set the scene briefly. Explain your own action. End with what happened or what you learned.</p></details>`}`,showFeedback?btn("Back to my draft","question-draft")+btn("Try in a mock interview →","question-to-interview","primary"):btn("Use example answer","question-example","textButton")+btn(state.signedIn?"View example feedback →":"Sign in to see feedback preview →","question-feedback","primary"),true);}
function historyScreen(){return `<p class="sourceBadge">Illustrative saved interviews · each keeps its own transcript and feedback</p><div class="historyRows">${[["11","SEP","HR round","Make your own contribution clear."],["09","SEP","Managerial round","Explain the trade-off behind your decision."],["06","SEP","HR round","Connect your interest to the work."]].map(([day,month,round,focus],i)=>`<button class="historyRow" data-action="history-report" data-value="${i}"><span class="date"><b>${day}</b>${month} · example</span><div><h3>Customer Success Associate</h3><p>${round} · completed · ${focus}</p></div><span>View feedback ↗</span></button>`).join("")}</div><p class="fine">Example history only. The preview’s full report illustrates the first record; the other records show their own concise focus in a dialog.</p>`;}
function render(){const selected=state.view==="questions"?"questions":state.view==="home"?"home":"practice";$("nav").innerHTML=[["home","Interview home"],["practice","Mock interview"],["questions","Question practice"]].map(([id,name])=>`<button data-action="go" data-value="${id}" ${selected===id?'aria-current="page"':""}>${name}</button>`).join("")+`<small>ONE WORKSPACE. YOUR NEXT CONVERSATION.</small>`;const heads={home:["INTERVIEW PREPARATION","Make your next conversation count.","Choose a full rehearsal or work on the one answer that needs attention.","/interview"],practice:["YOUR INTERVIEW STARTS HERE","A little preparation. A better rehearsal.","Choose the role, round and way you want to answer.","/interview/practice"],room:["A CONVERSATION, ONE QUESTION AT A TIME","Find your own way to say it.","Example interview room · voice and typing interactions are simulated.","/interview/practice"],feedback:["REFLECT. REFINE. TRY AGAIN.","Know what to keep. Know what to change.","Concise feedback tied to the answers in this example interview.","/interview/practice"],questions:["A FEW MINUTES. ONE BETTER ANSWER.","Practise the question that matters next.",state.signedIn?"Start with an answer that needs work, then try something new. Example progress shown.":"Browse freely. Sign in when you want feedback saved to your record.","/interview/questions"],history:["YOUR PREPARATION, KEPT TOGETHER","Come back to what you learned.","Pick an interview to see its feedback and decide what to practise.","/interview/practice"]};const h=heads[state.view];$("eyebrow").textContent=h[0];$("title").textContent=h[1];$("subtitle").textContent=h[2];$("route").textContent=h[3];$("authLabel").textContent=state.signedIn?"Example: returning user ⇄":"Preview: signed out ⇄";$("screen").innerHTML=({home,practice,room,feedback,questions:library,history:historyScreen}[state.view])();notify("");}
function start(){if(!state.role.trim()){notify("Add a role so the interview has a clear focus.");$("role").focus();return;}if(!state.signedIn){modal("Keep your interview and feedback together.",`<p>In the live flow, signing in keeps your setup and gives the interview a record to save to.</p><p>This dialog only simulates sign-in and does not request credentials.</p>`,btn("Back to setup","close")+btn("Preview signed-in start →","auth-start","primary"));return;}if(state.mode==="voice"&&state.mic==="blocked"){notify("The simulated microphone is unavailable. Switch to typing to continue.");return;}state.question=0;state.recording=false;go("room");}
document.addEventListener("input",e=>{const t=e.target;if(t.id==="role")state.role=t.value;if(t.id==="jd")state.jd=t.value;if(t.id==="focus")state.focus=t.value;if(t.id==="roomAnswer")state.answers[state.question]=t.value;if(t.id==="questionAnswer")state.drafts[state.activeQuestion]=t.value;if(t.id==="search"){state.search=t.value;state.page=0;$("questionResults").innerHTML=questionCards();}});
document.addEventListener("change",e=>{if(["roundFilter","competency"].includes(e.target.id)){state[e.target.id]=e.target.value;state.page=0;$("questionResults").innerHTML=questionCards();}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==="width"){$("frame").dataset.mobile=String(v==="mobile");document.querySelectorAll('[data-action="width"]').forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.value===v)));return;}
 if(a==="close"){$("modal").close();return;}
 if(a==="auth"){state.signedIn=!state.signedIn;render();return;}
 if(a==="go"){go(v);return;}
 if(["practice","questions","history","feedback"].includes(a)){go(a);return;}
 if(a==="change-role"){go("practice");$("role").focus();return;}
 if(["round","interviewer","mode"].includes(a)){state[a]=v;state.recording=false;render();return;}
 if(a==="mic"){modal("Microphone check preview.",`<p>Try the ready or unavailable state. This preview never requests device permission or captures audio.</p>`,btn("Show unavailable state","mic-blocked")+btn("Show ready state","mic-ready","primary"));return;}
 if(a==="mic-blocked"||a==="mic-ready"){state.mic=a==="mic-ready"?"ready":"blocked";$("modal").close();render();return;}
 if(a==="start"){start();return;}
 if(a==="auth-start"){state.signedIn=true;$("modal").close();start();return;}
 if(a==="record"){state.recording=!state.recording;render();return;}
 if(a==="sample-answer"){state.answers[state.question]=state.question===0?"I like helping someone understand what happens next. During a college event, I worked with visitors at the help desk and enjoyed finding a clear answer to their questions.":state.question===1?questions[0].sample:"What would a useful first month in this role look like?";state.recording=false;render();notify("Illustrative transcript inserted. Edit it to explore the interaction.");return;}
 if(a==="next-question"){state.recording=false;if(state.question<2){state.question++;render();$("title").focus({preventScroll:true});}else go("feedback");return;}
 if(a==="transcript"){modal("Your preview conversation.",Object.entries(state.answers).length?Object.entries(state.answers).map(([i,answer])=>`<p><strong>Question ${Number(i)+1}</strong></p><div class="quote">${esc(answer)}</div>`).join(""):`<p>No responses entered yet. Your local draft will appear here when you type one.</p>`);return;}
 if(a==="end"){modal("Finish this interview preview?",`<p>Your typed responses remain in this tab. The next screen shows a fixed example report, not feedback on those responses.</p>`,btn("Continue interview","close")+btn("View example feedback →","end-confirm","primary"));return;}
 if(a==="end-confirm"){$("modal").close();go("feedback");return;}
 if(a==="filter"){state.filter=v;state.page=0;render();return;}
 if(a==="page"){state.page+=Number(v);$("questionResults").innerHTML=questionCards();return;}
 if(a==="reset-filters"){state.filter="all";state.search="";state.roundFilter="all";state.competency="all";state.page=0;render();return;}
 if(a==="question"){questionSheet(v);return;}
 if(a==="question-example"){const q=questions.find(q=>q.id===state.activeQuestion);state.drafts[q.id]=q.sample;questionSheet(q.id);return;}
 if(a==="question-feedback"){if(!state.signedIn){modal("Save your practice with an account.",`<p>In the live flow, sign in to get feedback on your answer and keep your attempts together. Your draft stays in place.</p><p>This preview only demonstrates that handoff.</p>`,btn("Back to my draft","question-draft")+btn("Preview signed-in feedback →","auth-feedback","primary"));return;}questionSheet(state.activeQuestion,true);return;}
 if(a==="auth-feedback"){state.signedIn=true;questionSheet(state.activeQuestion,true);$("authLabel").textContent="Example: returning user ⇄";return;}
 if(a==="question-draft"){questionSheet(state.activeQuestion);return;}
 if(a==="question-to-interview"){const q=questions.find(q=>q.id===state.activeQuestion);state.focus=`Practise ${q.competency.toLowerCase()}: ${q.note}`;state.round=q.round;$("modal").close();go("practice");notify("Question focus carried into the optional interview focus field.");return;}
 if(a==="interview-evidence"){const evidence=[["Relevant motivation","“I like staying with a problem until the person knows what happens next.”","Keep the connection between your interest and the day-to-day work."],["Show your own action","“We had to learn the registration tool quickly and we sorted it out.”","Name what you did personally and the result it led to."],["A useful question","“What does a useful first month in this role look like?”","Keep asking about the work and the expectations you will be measured against."]][Number(v)];modal(evidence[0],`<span class="chip">EXAMPLE TRANSCRIPT EVIDENCE</span><div class="quote">${evidence[1]}</div><p>${evidence[2]}</p>`);return;}
 if(a==="history-report"){if(v==="0")go("feedback");else modal(v==="1"?"Explain the trade-off.":"Connect your interest to the work.",`<span class="chip">${v==="1"?"MANAGERIAL":"HR"} ROUND · EXAMPLE HISTORY</span><p>${v==="1"?"The example feedback asks you to name why one customer issue was more urgent than the others.":"The example feedback asks you to explain which part of the role connects to an experience of your own."}</p>`,btn("Practise the related question →","history-question","primary",v==="1"?"pressure":"role"));return;}
 if(a==="history-question"){questionSheet(v);return;}
 if(a==="about"){modal("Three pages. One preparation journey.",`<p><strong>Interview home:</strong> a direct route into a mock interview, focused question practice or previous feedback.</p><p><strong>Mock interview:</strong> compact setup, accessible voice/typing choices, one active question and concise feedback.</p><p><strong>Question practice:</strong> searchable cards, clear progress labels and one specific improvement at a time.</p><p>Everything is illustrative. Voice, sign-in and AI feedback are simulated; no account changes or microphone access occur.</p>`);}
});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(views.includes(v)){state.view=v;render();}});const initial=location.hash.slice(1);if(views.includes(initial))state.view=initial;render();
</script></body></html>
